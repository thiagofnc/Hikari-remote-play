name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create/update (e.g. v0.2.0). Created on the selected commit if it does not exist.
        required: true
        type: string
      draft:
        description: Create the release as a draft
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IDF_VERSION: v5.3.6

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then tag="$INPUT_TAG"; else tag="$GITHUB_REF_NAME"; fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$tag' is not of the form vMAJOR.MINOR.PATCH[-suffix]"
            exit 1
          fi
          version="${tag#v}"
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version, prerelease=$pre)"

  windows:
    name: Build Windows (MSVC)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve libopus tag
        id: opus
        shell: bash
        run: |
          tag=$(sed -nE 's/^set\(HIKARI_OPUS_GIT_TAG "([^"]+)".*/\1/p' cmake/Opus.cmake)
          echo "tag=${tag:-v1.5.2}" >> "$GITHUB_OUTPUT"

      - name: Cache libopus source
        id: opus-cache
        uses: actions/cache@v4
        with:
          path: .deps/opus
          key: opus-src-${{ steps.opus.outputs.tag }}

      - name: Fetch libopus source
        if: steps.opus-cache.outputs.cache-hit != 'true'
        shell: bash
        run: git clone --quiet --depth 1 --branch "${{ steps.opus.outputs.tag }}" https://github.com/xiph/opus.git .deps/opus

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { pip install ninja }

      # HIKARI_VERSION_OVERRIDE is consumed by the top-level CMakeLists once it
      # supports it; until then CMake just reports it as unused.
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DHIKARI_WITH_OPUS=ON
          -DHIKARI_BUILD_TESTS=ON
          -DHIKARI_BUILD_TOOLS=ON
          "-DHIKARI_VERSION_OVERRIDE=${{ needs.version.outputs.version }}"
          "-DFETCHCONTENT_SOURCE_DIR_OPUS=${{ github.workspace }}/.deps/opus"

      # Builds `all`, which includes the `Hikari` app and whatever hikari-*
      # tools currently exist.
      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -BuildDir build -Version "${{ needs.version.outputs.version }}" -OutDir dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/Hikari.exe
            dist/Hikari-*-win64.zip
          if-no-files-found: error

  firmware:
    name: Build firmware (ESP32-S3)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache ESP-IDF managed components
        uses: actions/cache@v4
        with:
          path: firmware/esp32-s3/managed_components
          key: idf-components-${{ env.IDF_VERSION }}-${{ hashFiles('firmware/esp32-s3/main/idf_component.yml') }}
          restore-keys: idf-components-${{ env.IDF_VERSION }}-

      # (The action wraps `command` in single quotes: don't use any here.)
      - name: Build firmware and merged image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: firmware/esp32-s3
          command: >-
            idf.py build &&
            cd build &&
            esptool.py --chip esp32s3 merge_bin -o ../hikari-bridge-esp32s3.bin @flash_args

      - uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: firmware/esp32-s3/hikari-bridge-esp32s3.bin
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, windows, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          test -f Hikari.exe
          test -f hikari-bridge-esp32s3.bin
          sha256sum Hikari.exe Hikari-*-win64.zip hikari-bridge-esp32s3.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes header
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          ## Download

          | File | What it is |
          | --- | --- |
          | **[Hikari.exe](https://github.com/${REPO}/releases/download/${TAG}/Hikari.exe)** | The app. Download and run it on Windows 10/11 (x64). No installer, no runtime needed. |
          | [Hikari-${VERSION}-win64.zip](https://github.com/${REPO}/releases/download/${TAG}/Hikari-${VERSION}-win64.zip) | The app plus diagnostic tools (\`tools/\`), README, LICENSE and docs. |
          | [hikari-bridge-esp32s3.bin](https://github.com/${REPO}/releases/download/${TAG}/hikari-bridge-esp32s3.bin) | Controller-bridge firmware for an ESP32-S3 DevKitC-1. Flash at address **0x0**. |
          | [SHA256SUMS.txt](https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS.txt) | Checksums for all of the above. |

          **Flashing the bridge:** plug the board's **UART** port into your PC and run
          \`powershell -ExecutionPolicy Bypass -File scripts\\flash-firmware.ps1\` from the source tree,
          or use [esptool-js](https://espressif.github.io/esptool-js/) in Chrome/Edge (address 0x0).
          Then plug the board's **USB** port into the Switch 2 dock.

          Windows SmartScreen may warn about an unrecognised app on first run: choose *More info* → *Run anyway*.

          EOF
          cat notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Hikari ${{ needs.version.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/Hikari.exe
            dist/Hikari-*-win64.zip
            dist/hikari-bridge-esp32s3.bin
            dist/SHA256SUMS.txt
